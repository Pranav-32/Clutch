# Audience: maintainers and contributors changing CI/release automation.
# Conventional Commits update a reviewable version/changelog PR on main.
# Release publication remains in release.yml after an explicit version tag.
name: Version proposal
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: version-proposal
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A scoped bot/App token enables normal CI events on generated PRs.
          # Without one, GitHub suppresses ordinary PR events from this token;
          # generated proposal checks need a separate workflow dispatch.
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          skip-github-release: true
