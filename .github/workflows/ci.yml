# Audience: maintainers and contributors changing CI/release automation.
# Verify PRs once, then the merged main commit. Tags use the Release workflow.
name: CI
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Verification scope
    runs-on: ubuntu-24.04
    outputs:
      metadata_only: ${{ steps.scope.outputs.metadata_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Classify changed files
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python .github/scripts/ci_policy.py plan
  native:
    needs: changes
    uses: ./.github/workflows/build.yml
    with:
      metadata-only: ${{ needs.changes.outputs.metadata_only == 'true' }}
  container:
    name: Development container
    needs: changes
    # Release notes/version metadata cannot affect the image or native tests.
    if: needs.changes.outputs.metadata_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build shared development image
        # Plain docker run has no devcontainer client to remap ownership. Match
        # the runner's UID so the nonroot image user can write the source mount.
        run: >-
          docker build --file .devcontainer/Dockerfile
          --build-arg USER_UID="$(id -u)" --tag clutch-dev:ci .devcontainer
      - name: Verify mounted workspace
        run: >-
          docker run --rm
          --mount "type=bind,source=${{ github.workspace }},target=/home/clutch-dev/workspace"
          clutch-dev:ci bash .devcontainer/post-create.sh
