# Keep pinned workflow actions current through reviewable, grouped PRs.
# Vendored C++ headers are reviewed separately; no package manifest manages them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      workflow-actions:
        patterns:
          - '*'
