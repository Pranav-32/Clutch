# Configure an ordinary CMake library without adding a Clutch manifest to it.
[project]
name = "foreign-example"
version = "1.0.0"
language = "cpp"
std = 17
entry = "main.cpp"

[build]
generator = "ninja"

[dependencies]
greeting = { path = "native", target = "Greeting::Greeting" }

[profile.debug]
build_dir = "Clutch-build-debug"

[profile.release]
build_dir = "Clutch-build-release"
