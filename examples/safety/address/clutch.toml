# Optional address policy; configure probes the selected compiler/runtime.
[project]
name = "safety_address"
version = "0.1.0"
language = "cpp"
std = 17
entry = "../main.cpp"

[profile.debug]
build_dir = "Clutch-build-debug"
debug_symbols = true

[profile.debug.safety]
sanitizers = ["address"]
lifetime = false
strictness = "strict"

[profile.release]
build_dir = "Clutch-build-release"
debug_symbols = true

[profile.release.safety]
sanitizers = ["address"]
lifetime = false
strictness = "normal"
