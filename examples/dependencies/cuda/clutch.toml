# Requires an installed CUDA Toolkit; this host C++ example compiles no .cu files.
[project]
name = "installed-cuda"
version = "1.0.0"
language = "cpp"
std = 17
entry = "../main.cpp"

[build]
generator = "ninja"
include_dirs = ["."]

[dependencies]
cuda = { system = "CUDAToolkit", target = "CUDA::cudart_static" }

[[test]]
name = "package-test"
sources = ["../checks/package_test.cpp"]

[profile.debug]
build_dir = "Clutch-build-debug"

[profile.release]
build_dir = "Clutch-build-release"
