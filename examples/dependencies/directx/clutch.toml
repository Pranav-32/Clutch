# Requires the Windows SDK and an initialized MSVC/clang-cl developer environment.
[project]
name = "installed-directx"
version = "1.0.0"
language = "cpp"
std = 17
entry = "../main.cpp"

[build]
generator = "ninja"
include_dirs = ["."]

[dependencies]
graphics = { system = "windows-sdk", libraries = ["d3d12"] }

[[test]]
name = "package-test"
sources = ["../checks/package_test.cpp"]

[profile.debug]
build_dir = "Clutch-build-debug"

[profile.release]
build_dir = "Clutch-build-release"
