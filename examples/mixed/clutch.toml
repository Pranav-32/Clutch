# C and C++ translation units keep separate standards and share one executable.
[project]
name = "mixed_app"
version = "0.1.0"
language = "mixed"
std = { c = 11, cpp = 17 }

[build]
generator = "ninja"
# Omit sources to demonstrate recursive discovery below src/.
include_dirs = ["src"]

[profile.debug]
build_dir = "Clutch-build-debug"
optimize = "none"
warnings = "extra"

[profile.release]
build_dir = "Clutch-build-release"
optimize = "speed"
warnings = "extra"
