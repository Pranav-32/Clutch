# '**' traverses descendants; braces select multiple suffixes without a shell.
[project]
name = "recursive_example"
version = "0.1.0"
language = "mixed"
std = { c = 11, cpp = 17 }

[build]
sources = ["../src/**.{cpp,c,h,hpp}"]

[profile.debug]
build_dir = "Clutch-build-debug"

[profile.release]
build_dir = "Clutch-build-release"
