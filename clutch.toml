# Native build of Clutch. CMake remains the initial bootstrap/development path.
[project]
name = "clutch"
version_file = "VERSION"
language = "cpp"
std = 17

[build]
sources = ["src/**.{cpp,hpp}"]
include_dirs = ["src", "third_party"]
runtime = "static"

[[configure_file]]
input = "src/core/version.hpp.in"
output = "core/version.hpp"
git_version = true

[profile.debug]
debug_symbols = true
build_dir = "Clutch-build-debug"
optimize = "none"
warnings = "extra"

[profile.release]
debug_symbols = false
build_dir = "Clutch-build-release"
optimize = "speed"
warnings = "extra"
